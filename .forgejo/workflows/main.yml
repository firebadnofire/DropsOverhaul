name: Signed development release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew build --no-daemon
      - name: Collect eligible distributions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew stageReleaseArtifacts --no-daemon
          mkdir -p dist
          for file in build/release-dist/*.jar; do
            case "$file" in *-sources.jar|*-javadoc.jar|*-tests.jar) continue ;; esac
            [ -f "$file" ] || continue
            jar tf "$file" | grep -Ex 'plugin\.yml|META-INF/mods\.toml|mcmod\.info' >/dev/null
            cp "$file" dist/
          done
          compgen -G 'dist/*.jar' >/dev/null
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: plugin-jars
          path: dist/*.jar
          if-no-files-found: error

  release:
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      # No checkout or execution of repository build scripts in this job.
      - name: Install signing and API tools
        run: apt-get update && apt-get install -y --no-install-recommends gnupg curl jq
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: plugin-jars
          path: dist
      - name: Sign and verify distributions
        shell: bash
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$CI_KEY_B64" | base64 --decode | gpg --batch --import
          unset CI_KEY_B64
          cd dist
          shopt -s nullglob
          jars=(*.jar)
          [ "${#jars[@]}" -gt 0 ] || { echo 'No plugin JARs received' >&2; exit 1; }
          sha256sum -- "${jars[@]}" > SHA256SUMS
          for file in "${jars[@]}" SHA256SUMS; do
            printf '%s\n' "$CI_KEY_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -- "$file"
            gpg --batch --verify "$file.asc" "$file"
          done
          sha256sum --check SHA256SUMS
      - name: Publish verified development release
        shell: bash
        env:
          API: ${{ forgejo.api_url }}
          REPOSITORY: ${{ forgejo.repository }}
          SHA: ${{ forgejo.sha }}
          TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          id=''
          trap 'echo "Publication failed at line $LINENO; draft release ID: ${id:-not created}. Earlier draft 2894 is unrelated and has not been modified." >&2' ERR
          [[ "$API" == https://* ]] || { echo 'Invalid Forgejo API URL: HTTPS required' >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA: expected 40 lowercase hexadecimal characters' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Invalid repository owner/name' >&2; exit 1; }
          [ -n "$TOKEN" ] || { echo 'Forgejo workflow token is missing' >&2; exit 1; }
          base="${API%/}/repos/$REPOSITORY"
          tag="build-${SHA:0:12}"
          auth=(-H "Authorization: token $TOKEN")
          request() {
            local method=GET arg url='' response status
            local previous=''
            for arg in "$@"; do
              [ "$previous" != '-X' ] || method="$arg"
              case "$arg" in https://*) url="$arg" ;; esac
              previous="$arg"
            done
            echo "API $method ${url#"$API"} (draft ID: ${id:-not created})" >&2
            response=$(mktemp)
            if ! status=$(curl --silent --show-error "${auth[@]}" -o "$response" -w '%{http_code}' "$@"); then
              rm -f "$response"
              echo 'API transport failure; no HTTP response' >&2
              return 1
            fi
            echo "HTTP $status" >&2
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              # Redact the actual token and escape control characters before logging.
              jq -Rs --arg token "$TOKEN" 'split($token) | join("[REDACTED]") | .[0:4096]' "$response" >&2
            fi
            cat "$response"
            rm -f "$response"
            [[ "$status" =~ ^2[0-9][0-9]$ ]]
          }
          api() { request "$@"; }
          # Authentication/read check; write capabilities are checked by each API operation.
          api "$base" >/dev/null
          api "$base/branches/main" > branch.json
          if ! jq -e '.protected == true' branch.json >/dev/null; then
            echo 'WARNING: main is not reported as protected. Restrict main pushes to trusted contributors. Release publication will continue.' >&2
          fi
          echo "API GET /repos/$REPOSITORY/releases/tags/$tag (before draft creation)" >&2
          status=$(curl --silent --show-error "${auth[@]}" -o existing.json -w '%{http_code}' "$base/releases/tags/$tag")
          echo "HTTP $status" >&2
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then
            jq -Rs --arg token "$TOKEN" 'split($token) | join("[REDACTED]") | .[0:4096]' existing.json >&2
          fi
          if [ "$status" = 200 ]; then
            echo "Release $tag already exists; refusing to replace any assets. Inspect its commit and assets before rerunning." >&2
            exit 1
          fi
          [ "$status" = 404 ] || { echo "Release lookup failed: HTTP $status" >&2; exit 1; }
          echo "API GET /repos/$REPOSITORY/tags/$tag (before draft creation)" >&2
          status=$(curl --silent --show-error "${auth[@]}" -o existing-tag.json -w '%{http_code}' "$base/tags/$tag")
          echo "HTTP $status" >&2
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then
            jq -Rs --arg token "$TOKEN" 'split($token) | join("[REDACTED]") | .[0:4096]' existing-tag.json >&2
          fi
          if [ "$status" = 200 ]; then
            [ "$(jq -r .commit.sha existing-tag.json)" = "$SHA" ] || { echo 'Tag collision: commit differs' >&2; exit 1; }
          elif [ "$status" != 404 ]; then
            echo "Tag lookup failed: HTTP $status" >&2; exit 1
          fi
          if [ "$status" = 404 ]; then
            api -X POST -H 'Content-Type: application/json' --data "$(jq -n --arg tag "$tag" --arg sha "$SHA" '{tag_name:$tag,target:$sha}')" "$base/tags" >/dev/null
          fi
          body=$(printf 'Repository: %s\nCommit: %s\nBranch: main\nBuild system: Gradle\nJava: 21' "$REPOSITORY" "$SHA")
          payload=$(jq -n --arg tag "$tag" --arg sha "$SHA" --arg title "Development Build ${SHA:0:12}" --arg body "$body" '{tag_name:$tag,target_commitish:$sha,name:$title,body:$body,draft:true,prerelease:true}')
          api -X POST -H 'Content-Type: application/json' --data "$payload" "$base/releases" > release.json
          id=$(jq -er .id release.json)
          trap 'echo "Publication failed: draft release ID $id ($tag) may contain partial assets; inspect it before retrying. No existing assets were replaced." >&2' ERR
          api "$base/tags/$tag" | jq -e --arg sha "$SHA" '.commit.sha == $sha' >/dev/null || { echo "Tag $tag does not resolve to expected commit $SHA; draft $id requires inspection" >&2; exit 1; }
          for file in dist/*.jar dist/*.jar.asc dist/SHA256SUMS dist/SHA256SUMS.asc; do
            api -X POST -F "attachment=@$file" "$base/releases/$id/assets" >/dev/null
          done
          api "$base/releases/$id/assets" > assets.json
          expected=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          actual=$(jq -r '.[].name' assets.json | sort)
          [ "$expected" = "$actual" ] || { echo "Asset inventory mismatch; draft $id has not been published" >&2; exit 1; }
          api -X PATCH -H 'Content-Type: application/json' --data '{"draft":false,"prerelease":true}' "$base/releases/$id" >/dev/null
          api "$base/releases/$id" | jq -e '.draft == false and .prerelease == true' >/dev/null || { echo "Final release state verification failed for ID $id" >&2; exit 1; }
