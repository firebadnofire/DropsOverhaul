plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '5.1.77'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}
def manifest = new groovy.json.JsonSlurper().parse(file('../versions.json'))
def targetId = providers.gradleProperty('targetId').getOrElse('forge-1.19')
def target = manifest.artifacts.find { it.id == targetId && it.buildDirectory == 'forge-1.19' }
if (target == null) throw new GradleException("No target in this build: ${targetId}")
group = 'org.infotoast'
version = manifest.projectVersion
java.toolchain.languageVersion = JavaLanguageVersion.of(target.buildJava)
minecraft { mappings channel: 'official', version: target.minecraft }
repositories { mavenCentral() }
configurations {
    bundled
    implementation.extendsFrom bundled
}
dependencies {
    minecraft "net.minecraftforge:forge:${target.minecraft}-${target.forgeBuild}"
    bundled 'org.yaml:snakeyaml:2.5'
}
sourceSets.main {
    java.srcDirs += ['../common/src/main/java', '../forge-common/src/main/java']
    java.srcDir "../forge-adapters/feedback-${target.commandFeedback}"
    resources.srcDir '../src/main/resources'
    resources.exclude 'plugin.yml'
}
processResources {
    inputs.property 'targetId', targetId
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version, minecraft: target.minecraft, forgeBuild: target.forgeBuild,
                forgeMajor: target.forgeBuild.tokenize('.').first(), forgeNextMajor: target.forgeBuild.tokenize('.').first().toInteger() + 1)
    }
}
jar { archiveClassifier = 'unshaded-dev' }
shadowJar {
    configurations = [project.configurations.bundled]
    archiveFileName = target.artifact.replace('{version}', project.version.toString())
    relocate 'org.yaml.snakeyaml', 'org.infotoast.dropsoverhaul.internal.yaml'
}
reobf { shadowJar {} }
shadowJar.finalizedBy 'reobfShadowJar'
build.dependsOn shadowJar
sourceSets {
    runtimeTest {
        java.srcDir '../tests/forge-1.19/src'
        resources.srcDir '../tests/forge-1.19/resources'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}
tasks.register('runtimeTestJar', Jar) {
    archiveFileName = 'DropsOverhaul-runtime-tests.jar'
    destinationDirectory = layout.buildDirectory.dir('test-fixtures')
    from sourceSets.runtimeTest.output
}
reobf { runtimeTestJar {} }
runtimeTestJar.finalizedBy 'reobfRuntimeTestJar'
